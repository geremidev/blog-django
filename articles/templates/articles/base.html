{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titre %}Mon blog{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'articles/css/style.css' %}">
</head>
<body>
    <header class="entete">
        <div class="conteneur entete-contenu">
            <a href="{% url 'articles:liste' %}" class="logo">Mon<span>Blog</span></a>
            <p class="slogan">Code, idées et apprentissage</p>
        </div>
    </header>

    <main class="conteneur">
        {% block contenu %}{% endblock %}
    </main>

    <footer class="pied">
        <p>© 2026 Mon blog · Fait avec Django</p>
    </footer>
</body>
</html>
